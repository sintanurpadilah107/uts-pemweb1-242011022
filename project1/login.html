<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Pengguna</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Portal Perusahaan</a>
      <a href="index.html" class="btn btn-outline-light btn-sm px-3">Kembali ke Beranda</a>
    </div>
  </nav>

  <main class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="card border-0 shadow-sm rounded-3 p-4 p-md-5" style="max-width: 440px; width: 100%;">
      <h3 class="fw-bold text-dark text-center mb-4">Login</h3>

      <div id="loginAlert" class="d-none" role="alert"></div>

      <form onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label for="loginUsername" class="form-label text-dark">Username</label>
          <input type="text" id="loginUsername" class="form-control" placeholder="sinta24">
        </div>
        <div class="mb-4">
          <label for="loginPassword" class="form-label text-dark">Password</label>
          <input type="password" id="loginPassword" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Masuk</button>
      </form>

      <p class="text-center text-muted small mt-3 mb-0">
        Belum punya akun? <a href="register.html" class="text-decoration-none">Registrasi</a>
      </p>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-2 mt-auto">
    <div class="container small">@Copyright by 242011022_Sinta Nurpadilah_TIF RP 24 F</div>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
